name: Mirroring

on: [push, delete]

jobs:
  to_gitlab:
    runs-on: ubuntu-latest
    steps:                                              # <-- must use actions/checkout before mirroring!
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            git@bitbucket.org:erp-praktikum/rap-handson-travel-docs.git
            # https://dachenej:@bitbucket.org/erp-praktikum/rap-handson-travel-docs.git
            # git@bitbucket.org:dachenej/erp-praktikum/rap-handson-travel-docs.git
            # git@gitlab.com:<username>/<target_repository_name>.git
          ssh_private_key:                              # <-- use 'secrets' to pass credential information.
            ${{ secrets.SSH_PRIVATE_KEY }}
